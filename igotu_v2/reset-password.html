<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password - IGotU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="reset-password">
  <main class="auth-page">
    <section class="auth-card">
      <a href="index.html" class="brand-link">IGotU</a>
      <h1>Set New Password</h1>
      <p class="auth-subtitle">Create a new password for your IGotU account.</p>

      <div id="messageBox" class="message-box hidden"></div>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" minlength="6" placeholder="At least 6 characters" required />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" minlength="6" placeholder="Repeat your new password" required />
        </div>
        <button type="submit" class="btn full-btn" id="resetPasswordBtn">Update Password</button>
      </form>

      <p class="auth-footer"><a href="login.html">Back to Login</a></p>
    </section>
  </main>
  <script type="module" src="js/password-recovery.js"></script>
</body>
</html>
