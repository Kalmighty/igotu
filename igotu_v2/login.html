<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - IGotU V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="login">
    <main class="auth-page">
        <section class="auth-card">
            <a href="index.html" class="brand-link">IGotU</a>

            <h1>Login</h1>
            <p class="auth-subtitle">Access your IGotU dashboard.</p>

            <div id="messageBox" class="message-box hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="auth-password-row">
                    <a href="forgot-password.html" class="forgot-password-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn full-btn" id="loginBtn">Login</button>
            </form>

            <p class="auth-footer">
                Do not have an account?
                <a href="register.html">Register here</a>
            </p>
        </section>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>

</html>
