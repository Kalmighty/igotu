<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Requests - IGotU V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/ui.css">
    <script src="../js/app-shell.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <div class="app-layout">
      <aside class="sidebar">
        <div>
          <div class="sidebar-brand">
            <a class="logo-text" href="dashboard.html" aria-label="IGotU Client dashboard">IGotU<span>Client workspace</span></a>
            <button class="navigation-toggle" type="button" aria-expanded="false" aria-controls="workspaceNavigation">
              Menu <span aria-hidden="true">☰</span>
            </button>
          </div>

          <nav class="side-menu" id="workspaceNavigation" aria-label="Client navigation">
            <a href="dashboard.html">▦ Dashboard</a>
            <a href="create-request.html">＋ Create Request</a>
            <a href="my-requests.html" class="active" aria-current="page">▣ My Requests</a>
                    <a href="messages.html">✉ Messages</a>
</nav>
        </div>
      </aside>

      <main class="main-area" id="mainContent" tabindex="-1">
        <header class="topbar">
          <div></div>
          <div class="topbar-actions">
          <div class="notification-menu-wrap">
            <button
              type="button"
              class="topbar-notification-btn"
              id="notificationMenuTrigger"
              aria-label="Notifications"
              aria-expanded="false"
              aria-controls="notificationDropdown"
              title="Notifications"
            >
              <span class="topbar-notification-icon" aria-hidden="true">🔔</span>
              <span class="notification-badge hidden">0</span>
            </button>

            <div id="notificationDropdown" class="notification-dropdown hidden">
              <div class="notification-dropdown-header">
                <div>
                  <strong>Notifications</strong>
                  <span id="notificationDropdownCount">0 unread</span>
                </div>

                <button
                  type="button"
                  id="notificationMarkAllBtn"
                  class="notification-mark-all-btn"
                >
                  Mark all as read
                </button>
              </div>

              <div id="notificationDropdownList" class="notification-dropdown-list">
                <div class="notification-dropdown-empty">
                  <span>🔔</span>
                  <strong>No notifications yet</strong>
                  <small>New updates will appear here.</small>
                </div>
              </div>
            </div>
          </div>

                    <div class="profile-menu-wrap">
            <button
              type="button"
              class="user-mini profile-menu-trigger"
              id="profileMenuTrigger"
              aria-expanded="false"
              aria-controls="profileDropdown"
            >
              <div class="avatar" id="avatar">C</div>
              <div class="profile-menu-user-text">
                <strong id="userName">Client</strong>
                <small id="userRole">Client</small>
              </div>
              <span class="profile-menu-chevron" aria-hidden="true">⌄</span>
            </button>

            <div id="profileDropdown" class="profile-dropdown hidden">
              <a href="edit-profile.html" class="profile-dropdown-item">
                <span class="profile-dropdown-icon">✎</span>
                <span>Edit Profile</span>
              </a>
              <button
                type="button"
                id="profileLogoutBtn"
                class="profile-dropdown-item profile-dropdown-logout"
              >
                <span class="profile-dropdown-icon">↪</span>
                <span>Log out</span>
              </button>
            </div>
          </div>
        </div>
      </header>

        <section class="content-area">
          <div class="page-heading">
            <div>
              <h1>My Requests</h1>
              <p>View and manage your service requests.</p>
            </div>

            <a href="create-request.html" class="btn">+ Create Request</a>
          </div>

          <div id="messageBox" role="status" class="message-box hidden"></div>

          <section class="panel">
            <div class="panel-header">
              <h2>Request List</h2>

              <select id="statusFilter" aria-label="Filter by status" class="small-filter">
                <option value="all">All Requests</option>
                <option value="pending">Pending</option>
                <option value="provider_selected">Provider Selected</option>
                <option value="confirmed">Confirmed</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>

            <div id="requestsList" class="request-list-area">
              <p class="muted-text">Loading requests...</p>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="../js/profile-guard.js"></script>
    <script type="module" src="../js/notification-badge.js"></script>
    <script type="module" src="../js/notification-menu.js"></script>
    <script type="module" src="../js/profile-menu.js"></script>

    <script type="module" src="../js/client-my-requests.js"></script>
</body>
</html>
