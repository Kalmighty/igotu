<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Request Details - IGotU V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/style.css" />

    <!-- Leaflet Map CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div>
          <div class="logo-text">IGotU</div>

          <nav class="side-menu">
            <a href="dashboard.html">▦ Dashboard</a>
            <a href="create-request.html">＋ Create Request</a>
            <a href="my-requests.html">▣ My Requests</a>
                    <a href="messages.html">✉ Messages</a>
                    <a href="notifications.html" class="notification-link">🔔 Notifications <span class="notification-badge hidden">0</span></a>
            <a href="../login.html" id="logoutBtn" class="logout-link"
              >↪ Logout</a
            >
          </nav>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div></div>
          <div class="user-mini">
            <div class="avatar" id="avatar">C</div>
            <div>
              <strong id="userName">Client</strong>
              <small id="userRole">Client</small>
            </div>
          </div>
        </header>

        <section class="content-area">
          <div class="page-heading">
            <div>
              <h1>Request Details</h1>
              <p>
                View the current progress and location of your service request.
              </p>
            </div>

            <a href="my-requests.html" class="btn btn-outline"
              >Back to My Requests</a
            >
          </div>

          <div id="messageBox" class="message-box hidden"></div>

          <section class="panel">
            <div class="panel-header">
              <h2 id="requestTitle">Loading request...</h2>
              <span id="requestStatus" class="status-pill">Loading</span>
            </div>

            <div class="panel-body">
              <div id="requestDetailsArea">
                <p class="muted-text">Loading request details...</p>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="../js/notification-badge.js"></script>

    <script type="module" src="../js/client-request-details.js"></script>
  </body>
</html>
