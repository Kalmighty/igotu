<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Client Notifications - IGotU</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div>
                <div class="logo-text">IGotU</div>

                <nav class="side-menu">
                    <a href="dashboard.html">▦ Dashboard</a>
                    <a href="create-request.html">＋ Create Request</a>
                    <a href="my-requests.html">▣ My Requests</a>
                    <a href="messages.html">✉ Messages</a>
                    <a href="notifications.html" class="active notification-link">🔔 Notifications <span class="notification-badge hidden">0</span></a>
                    <a href="../login.html" id="logoutBtn" class="logout-link">↪ Logout</a>
                </nav>
            </div>
        </aside>

        <main class="main-area">
            <header class="topbar">
                <div></div>
                <div class="user-mini">
                    <div class="avatar" id="avatar">C</div>
                    <div>
                        <strong id="userName">Client</strong>
                        <small id="userRole">Client</small>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="page-heading">
                    <div>
                        <h1>Notifications</h1>
                        <p>View important updates from your IGotU activity.</p>
                    </div>
                    <button class="btn" id="markAllReadBtn">Mark All as Read</button>
                </div>

                <div id="messageBox" class="message-box hidden"></div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">🔔</div>
                        <span>Total Notifications</span>
                        <strong id="totalNotifications">0</strong>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">●</div>
                        <span>Unread</span>
                        <strong id="unreadNotifications">0</strong>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">✓</div>
                        <span>Read</span>
                        <strong id="readNotifications">0</strong>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">⚡</div>
                        <span>Status</span>
                        <strong>Live</strong>
                    </div>
                </div>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Recent Notifications</h2>
                    </div>

                    <div id="notificationsList" class="list-box">
                        <p class="muted-text">Loading notifications...</p>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script type="module" src="../js/notification-badge.js"></script>
    <script type="module" src="../js/notifications.js"></script>
</body>

</html>
