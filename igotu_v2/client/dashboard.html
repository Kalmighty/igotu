<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Client Dashboard - IGotU</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div>
                <div class="logo-text">IGotU</div>

                <nav class="side-menu">
                    <a href="dashboard.html" class="active">▦ Dashboard</a>
                    <a href="create-request.html">＋ Create Request</a>
                    <a href="my-requests.html">▣ My Requests</a>
                    <a href="messages.html">✉ Messages</a>
                    <a href="notifications.html" class="notification-link">🔔 Notifications <span class="notification-badge hidden">0</span></a>
                    <a href="../login.html" id="logoutBtn" class="logout-link">↪ Logout</a>
                </nav>
            </div>
        </aside>

        <main class="main-area">
            <header class="topbar">
                <div></div>
                <div class="user-mini">
                    <div class="avatar" id="avatar">C</div>
                    <div>
                        <strong id="userName">Client</strong>
                        <small id="userRole">Client</small>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="page-heading">
                    <div>
                        <h1>Client Dashboard</h1>
                        <p id="welcomeText">Welcome back to IGotU.</p>
                    </div>

                    <a href="create-request.html" class="btn">+ Create Request</a>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📌</div>
                        <span>Total Requests</span>
                        <strong id="totalRequests">0</strong>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">⏳</div>
                        <span>Pending</span>
                        <strong id="pendingRequests">0</strong>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">🛠️</div>
                        <span>Ongoing</span>
                        <strong id="ongoingRequests">0</strong>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">✅</div>
                        <span>Completed</span>
                        <strong id="completedRequests">0</strong>
                    </div>
                </div>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Recent Requests</h2>
                        <a href="my-requests.html">View all</a>
                    </div>

                    <div id="recentRequests" class="list-box">
                        <p class="muted-text">Loading recent requests...</p>
                    </div>
                </section>
            </section>
        </main>
    </div>
    <script type="module" src="../js/notification-badge.js"></script>

    <script type="module" src="../js/client.js"></script>
</body>

</html>
