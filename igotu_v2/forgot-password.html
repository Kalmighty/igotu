<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password - IGotU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="forgot-password">
  <main class="auth-page">
    <section class="auth-card">
      <a href="index.html" class="brand-link">IGotU</a>
      <h1>Forgot Password</h1>
      <p class="auth-subtitle">Enter your IGotU email and we will send you a secure reset link.</p>

      <div id="messageBox" class="message-box hidden"></div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="example@email.com" required />
        </div>
        <button type="submit" class="btn full-btn" id="forgotPasswordBtn">Send Reset Link</button>
      </form>

      <p class="auth-footer"><a href="login.html">← Back to Login</a></p>
    </section>
  </main>
  <script type="module" src="js/password-recovery.js"></script>
</body>
</html>
