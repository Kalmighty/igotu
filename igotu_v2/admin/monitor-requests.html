<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Monitor Requests - IGotU V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />

    <!-- Leaflet Map CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      .admin-request-map-box {
        margin-top: 18px;
        background: white;
        border: 1px solid #edf1ee;
        border-radius: 14px;
        padding: 16px;
      }

      .admin-request-map-box h4 {
        margin: 0 0 12px;
        color: #111827;
        font-size: 17px;
      }

      .admin-request-map {
        width: 100%;
        height: 260px;
        border-radius: 14px;
        border: 1px solid #edf1ee;
        overflow: hidden;
        margin-bottom: 10px;
      }

      @media (max-width: 650px) {
        .admin-request-map {
          height: 300px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div>
          <div class="logo-text">IGotU</div>

          <nav class="side-menu">
            <a href="dashboard.html">▦ Dashboard</a>
            <a href="manage-users.html">👥 Manage Users</a>
            <a href="verifications.html">🛡 Verification Requests</a>
            <a href="reports.html">⚠ Service Reports</a>
            <a href="monitor-requests.html" class="active"
              >▣ Monitor Requests</a
            >
            <a href="monitor-payments.html">💰 Monitor Payments</a>
            <a href="monitor-reviews.html">⭐ Monitor Reviews</a>
            <a href="../login.html" id="logoutBtn" class="logout-link"
              >↪ Logout</a
            >
          </nav>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div></div>
          <div class="user-mini">
            <div class="avatar" id="avatar">A</div>
            <div>
              <strong id="userName">Admin</strong>
              <small id="userRole">Admin</small>
            </div>
          </div>
        </header>

        <section class="content-area">
          <div class="page-heading">
            <div>
              <h1>Monitor Requests</h1>
              <p>Track all service requests and their progress.</p>
            </div>

            <a href="dashboard.html" class="btn btn-outline"
              >Back to Dashboard</a
            >
          </div>

          <div id="messageBox" class="message-box hidden"></div>

          <section class="panel">
            <div class="panel-header admin-filter-header">
              <h2>Service Request List</h2>

              <div class="filter-row">
                <input
                  type="text"
                  id="searchInput"
                  class="small-search"
                  placeholder="Search request/client/provider"
                />

                <select id="statusFilter" class="small-filter">
                  <option value="all">All Status</option>
                  <option value="pending">Pending</option>
                  <option value="provider_selected">Provider Selected</option>
                  <option value="confirmed">Confirmed</option>
                  <option value="in_progress">In Progress</option>
                  <option value="completed">Completed</option>
                  <option value="cancelled">Cancelled</option>
                </select>

                <select id="categoryFilter" class="small-filter">
                  <option value="all">All Categories</option>
                  <option value="Cleaning">Cleaning</option>
                  <option value="Delivery">Delivery</option>
                  <option value="Repair">Repair</option>
                  <option value="Moving Help">Moving Help</option>
                  <option value="Errands">Errands</option>
                  <option value="Tutoring">Tutoring</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div id="requestsList" class="request-list-area">
              <p class="muted-text">Loading requests...</p>
            </div>
          </section>
        </section>
      </main>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="../js/admin-monitor-requests.js"></script>
  </body>
</html>
