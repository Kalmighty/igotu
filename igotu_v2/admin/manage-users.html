<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Users - IGotU V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/ui.css">
    <script src="../js/app-shell.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <div class="app-layout">
      <aside class="sidebar">
        <div>
          <div class="sidebar-brand">
            <a class="logo-text" href="dashboard.html" aria-label="IGotU Admin dashboard">IGotU<span>Admin workspace</span></a>
            <button class="navigation-toggle" type="button" aria-expanded="false" aria-controls="workspaceNavigation">
              Menu <span aria-hidden="true">☰</span>
            </button>
          </div>

          <nav class="side-menu" id="workspaceNavigation" aria-label="Admin navigation">
            <a href="dashboard.html">▦ Dashboard</a>
            <a href="manage-users.html" class="active" aria-current="page">👥 Manage Users</a>
            <a href="verifications.html">🛡 Verification Requests</a>
            <a href="reports.html">⚠ Service Reports</a>
            <a href="monitor-requests.html">▣ Monitor Requests</a>
            <a href="monitor-payments.html">💰 Monitor Payments</a>
            <a href="monitor-reviews.html">⭐ Monitor Reviews</a>
            <a href="../login.html" id="logoutBtn" class="logout-link"
              >↪ Logout</a
            >
          </nav>
        </div>
      </aside>

      <main class="main-area" id="mainContent" tabindex="-1">
        <header class="topbar">
          <div></div>
          <div class="user-mini">
            <div class="avatar" id="avatar">A</div>
            <div>
              <strong id="userName">Admin</strong>
              <small id="userRole">Admin</small>
            </div>
          </div>
        </header>

        <section class="content-area">
          <div class="page-heading">
            <div>
              <h1>Manage Users</h1>
              <p>View client, provider, and admin accounts.</p>
            </div>

            <a href="dashboard.html" class="btn btn-outline"
              >Back to Dashboard</a
            >
          </div>

          <div id="messageBox" role="status" class="message-box hidden"></div>

          <section class="panel">
            <div class="panel-header admin-filter-header">
              <h2>User List</h2>

              <div class="filter-row">
                <input
                  type="text"
                  id="searchInput" aria-label="Search records"
                  class="small-search"
                  placeholder="Search name or email"
                />

                <select id="roleFilter" aria-label="Filter by role" class="small-filter">
                  <option value="all">All Roles</option>
                  <option value="client">Client</option>
                  <option value="provider">Provider</option>
                  <option value="admin">Admin</option>
                </select>

                <select id="statusFilter" aria-label="Filter by status" class="small-filter">
                  <option value="all">All Status</option>
                  <option value="active">Active</option>
                  <option value="suspended">Suspended</option>
                </select>
              </div>
            </div>

            <div id="usersList" class="request-list-area">
              <p class="muted-text">Loading users...</p>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="../js/admin-manage-users.js"></script>
  </body>
</html>
