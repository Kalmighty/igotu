<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - IGotU V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="register">
    <main class="auth-page">
        <section class="auth-card">
            <a href="index.html" class="brand-link">IGotU</a>

            <h1>Create Account</h1>
            <p class="auth-subtitle">Register as a client or provider to start using IGotU.</p>

            <div id="messageBox" class="message-box hidden"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="role">Register As</label>
                    <select id="role" required>
                        <option value="">Select role</option>
                        <option value="client">Client</option>
                        <option value="provider">Provider</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn full-btn" id="registerBtn">Register</button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </section>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>

</html>
