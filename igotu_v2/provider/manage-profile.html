<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Profile - IGotU V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div>
                <div class="logo-text">🤝 IGotU</div>

                <nav class="side-menu">
                    <a href="dashboard.html">▦ Dashboard</a>
                    <a href="manage-profile.html" class="active">👤 Manage Profile</a>
                    <a href="incoming-requests.html">📥 Incoming Requests</a>
                    <a href="assignment-details.html">▣ Assignments</a>
                    <a href="../login.html" id="logoutBtn" class="logout-link">↪ Logout</a>
                </nav>
            </div>
        </aside>

        <main class="main-area">
            <header class="topbar">
                <div></div>
                <div class="user-mini">
                    <div class="avatar" id="avatar">P</div>
                    <div>
                        <strong id="userName">Provider</strong>
                        <small id="userRole">Provider</small>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="page-heading">
                    <div>
                        <h1>Manage Provider Profile</h1>
                        <p>Set your service details, availability, location, and skills.</p>
                    </div>

                    <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
                </div>

                <section class="panel form-panel">
                    <div class="panel-header">
                        <h2>Profile Details</h2>
                    </div>

                    <div class="panel-body">
                        <div id="messageBox" class="message-box hidden"></div>

                        <form id="providerProfileForm">
                            <div class="form-group">
                                <label for="bio">Bio / Service Description</label>
                                <textarea id="bio" placeholder="Example: I can help with minor repair, delivery, and moving help." required></textarea>
                            </div>

                            <div class="form-group">
                                <label for="location">Service Location</label>
                                <input type="text" id="location" placeholder="Example: Kota Kinabalu, Sabah" required>
                            </div>

                            <div class="two-column">
                                <div class="form-group">
                                    <label for="providerLat">Latitude</label>
                                    <input type="number" id="providerLat" step="0.0000001" placeholder="Example: 5.9804">
                                </div>

                                <div class="form-group">
                                    <label for="providerLng">Longitude</label>
                                    <input type="number" id="providerLng" step="0.0000001" placeholder="Example: 116.0735">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="isAvailable">Availability</label>
                                <select id="isAvailable" required>
                                    <option value="true">Available</option>
                                    <option value="false">Unavailable</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Service Skills</label>

                                <div class="checkbox-grid">
                                    <label><input type="checkbox" name="skills" value="Cleaning"> Cleaning</label>
                                    <label><input type="checkbox" name="skills" value="Delivery"> Delivery</label>
                                    <label><input type="checkbox" name="skills" value="Repair"> Repair</label>
                                    <label><input type="checkbox" name="skills" value="Moving Help"> Moving Help</label>
                                    <label><input type="checkbox" name="skills" value="Errands"> Errands</label>
                                    <label><input type="checkbox" name="skills" value="Tutoring"> Tutoring</label>
                                    <label><input type="checkbox" name="skills" value="Other"> Other</label>
                                </div>
                            </div>

                            <button type="submit" id="saveProfileBtn" class="btn full-btn">
                                Save Profile
                            </button>
                        </form>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script type="module" src="../js/provider-profile.js"></script>
</body>

</html>
