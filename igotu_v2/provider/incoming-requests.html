<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Incoming Requests - IGotU V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div>
          <div class="logo-text">IGotU</div>

          <nav class="side-menu">
            <a href="dashboard.html">▦ Dashboard</a>
            <a href="manage-profile.html">👤 Manage Profile</a>
            <a href="incoming-requests.html" class="active"
              >📥 Incoming Requests</a
            >
            <a href="assignment-details.html">▣ Assignments</a>
                    <a href="messages.html">✉ Messages</a>
                    <a href="notifications.html" class="notification-link">🔔 Notifications <span class="notification-badge hidden">0</span></a>
            <a href="../login.html" id="logoutBtn" class="logout-link"
              >↪ Logout</a
            >
          </nav>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div></div>
          <div class="user-mini">
            <div class="avatar" id="avatar">P</div>
            <div>
              <strong id="userName">Provider</strong>
              <small id="userRole">Provider</small>
            </div>
          </div>
        </header>

        <section class="content-area">
          <div class="page-heading">
            <div>
              <h1>Incoming Requests</h1>
              <p>These are service requests assigned to you by clients.</p>
            </div>

            <a href="dashboard.html" class="btn btn-outline"
              >Back to Dashboard</a
            >
          </div>

          <div id="messageBox" class="message-box hidden"></div>

          <section class="panel">
            <div class="panel-header">
              <h2>Assigned Requests</h2>
              <a href="manage-profile.html">Update Profile</a>
            </div>

            <div id="incomingList" class="request-list-area">
              <p class="muted-text">Loading incoming requests...</p>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="../js/notification-badge.js"></script>

    <script type="module" src="../js/provider-incoming-requests.js"></script>
  </body>
</html>
